[project]
name = "arenya"
version = "0.1.0"
description = "Multi-agent D&D game that writes novels from its own play"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.174",
    "pyyaml>=6.0.3",
]

[project.scripts]
arenya = "arenya.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arenya"]
