<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arenya Game Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg:#0b0d17; --bg2:#11142a; --panel:#151935; --panel2:#1b2045; --line:#272d5c;
  --text:#e7e6f2; --muted:#9a9cc0; --faint:#6a6d96;
  --lamp:#f4c45a; --lamp2:#ffdf8e; --bulk:#9d7bff; --bulk2:#6a4fe0; --dark:#4fb3a9;
  --danger:#ff6b7a; --ok:#57d6a0; --warn:#ffb454;
  --r:12px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,#2a1f5e55,transparent),radial-gradient(900px 500px at -10% 110%,#3b2a0a44,transparent),var(--bg)}
a{color:var(--lamp)}
button{font:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2c3266;border-radius:10px}

/* top bar */
header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:#0d1022cc;backdrop-filter:blur(8px);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.brand{font-family:"Cormorant Garamond",serif;font-size:24px;font-weight:600;letter-spacing:.5px;color:var(--lamp2);display:flex;align-items:center;gap:8px}
.brand small{font-family:Inter;font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;font-weight:500}
.pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill b{color:var(--text);font-weight:600}
.pill.live{border-color:#2d6a52;color:var(--ok)}
.pill.paused{border-color:#7a4a17;color:var(--warn)}
.pill.human{border-color:var(--lamp);color:var(--lamp2);cursor:pointer;animation:glow 2s infinite}
@keyframes glow{50%{box-shadow:0 0 14px #f4c45a66}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle}
.dot.pulse{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #57d6a088}100%{box-shadow:0 0 0 8px #57d6a000}}
.spacer{flex:1}
nav{display:flex;gap:4px;padding:8px 18px;border-bottom:1px solid var(--line);background:#0d102299;overflow-x:auto}
nav button{background:none;border:0;color:var(--muted);padding:7px 14px;border-radius:8px;font-weight:500}
nav button:hover{color:var(--text);background:var(--panel)}
nav button.on{color:var(--bg);background:var(--lamp)}
main{padding:16px 18px;height:calc(100vh - 112px)}
.view{display:none;height:100%}
.view.on{display:block}

/* generic */
.card{background:linear-gradient(180deg,var(--panel),#12162f);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.mono{font-family:"JetBrains Mono",monospace;font-size:12px}
.tag{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:999px;background:var(--panel2);color:var(--muted);border:1px solid var(--line);margin-right:4px;text-transform:lowercase}
.tag.lamp{color:var(--lamp2);border-color:#6b5520}.tag.bulk{color:#c9b6ff;border-color:#4a3a8a}.tag.red{color:var(--danger);border-color:#6b2a33}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 12px;border-radius:8px;font-size:13px}
.btn:hover{border-color:var(--lamp)}
.btn.primary{background:var(--lamp);color:#1a1300;border-color:var(--lamp);font-weight:600}
.empty{color:var(--faint);padding:30px;text-align:center;font-style:italic}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#0b0d17;flex:none;box-shadow:0 0 0 2px #0b0d17,0 0 0 3px var(--c,#888)}
.avatar.sm{width:22px;height:22px;font-size:9.5px}

/* LIVE */
.live{display:grid;grid-template-columns:200px 1fr 330px;gap:14px;height:100%}
.chlist{display:flex;flex-direction:column;gap:2px;overflow:auto}
.ch{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13px}
.ch:hover{background:var(--panel)} .ch.on{background:var(--panel2);color:var(--text)}
.ch .n{font-size:11px;color:var(--faint)}
.chsec{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:12px 10px 4px}
.feedwrap{display:flex;flex-direction:column;min-height:0;height:100%}
.feed{flex:1;overflow:auto;padding:4px 6px 20px;scroll-behavior:smooth}
.msg{display:flex;gap:11px;padding:10px 10px;border-radius:10px;margin-bottom:2px}
.msg:hover{background:#ffffff06}
.msg .meta{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.msg .who{font-weight:600}
.msg .body{color:#dddcec;margin-top:2px;overflow-wrap:anywhere}
.msg .body p{margin:.3em 0}
.msg.narr .body{font-family:"Cormorant Garamond",serif;font-size:17.5px;line-height:1.5;color:#efe8d6}
.msg.dialogue .body{font-size:14.5px}
.msg.ooc{opacity:.78}
.msg.flash{animation:flash 2s}
@keyframes flash{0%{background:#f4c45a33}}
.roll{display:flex;gap:10px;align-items:center;margin:6px 0 6px 43px;padding:8px 12px;border-radius:10px;background:#1d1a35;border:1px dashed #4a3a8a;font-size:13px}
.roll .total{font-family:"Cormorant Garamond",serif;font-size:26px;font-weight:600;color:var(--lamp2);min-width:34px;text-align:center}
.roll.crit .total{color:var(--ok)} .roll.fumble .total{color:var(--danger)}
.sysline{margin:4px 0 4px 43px;font-size:12.5px;color:var(--muted)}
.scenebar{margin:22px 0 14px;text-align:center;position:relative}
.scenebar:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #3a3270}
.scenebar span{position:relative;background:var(--bg);padding:6px 16px;border:1px solid #4a3a8a;border-radius:999px;font-family:"Cormorant Garamond",serif;font-size:18px;color:#d8ccff}
.scenebar.end span{border-color:#6b5520;color:var(--lamp2)}
.scenesum{margin:-4px 40px 14px;padding:10px 14px;border-left:2px solid var(--lamp);background:#f4c45a0d;color:#e8dfc6;font-size:13.5px;border-radius:0 8px 8px 0}
.scrub{display:flex;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--bg2);border-radius:0 0 var(--r) var(--r)}
.scrub input[type=range]{flex:1;accent-color:var(--lamp)}
.side{display:flex;flex-direction:column;gap:12px;overflow:auto;min-height:0}
.job{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid #ffffff08;font-size:13px}
.exp{font-size:12.5px;padding:5px 0;border-bottom:1px solid #ffffff08}
textarea,input[type=text],select{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:90px;resize:vertical}
.ask{border:1px solid #6b5520;background:#f4c45a0a;border-radius:10px;padding:10px;margin-bottom:10px}
.ask .q{max-height:260px;overflow:auto;font-size:13px}
.ask .q p{margin:.35em 0}

/* SCENES */
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;overflow:auto;height:100%;align-content:start}
.scard .title{font-family:"Cormorant Garamond",serif;font-size:22px;color:#f1e9d4;line-height:1.15}
.scard .id{font-family:"JetBrains Mono";font-size:11px;color:var(--faint)}
.chap{grid-column:1/-1;font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--lamp2);margin:8px 0 -4px;border-bottom:1px solid var(--line);padding-bottom:4px}

/* CAST */
.castgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;overflow:auto;height:100%;align-content:start}
.ccard .head{display:flex;gap:12px;align-items:center}
.ccard .avatar{width:48px;height:48px;font-size:16px}
.ccard .nm{font-family:"Cormorant Garamond",serif;font-size:22px;line-height:1.1}
.bar{height:7px;background:#ffffff10;border-radius:9px;overflow:hidden;margin:3px 0 7px}
.bar i{display:block;height:100%;border-radius:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;margin:8px 0}
.kv span:nth-child(odd){color:var(--faint)}
.mem{font-size:12.5px;color:#cfcde4;background:#ffffff05;border-radius:8px;padding:8px 10px;margin-top:8px;max-height:150px;overflow:auto}
.mem p,.mem ul{margin:.2em 0}

/* MAP */
.mapwrap{display:grid;grid-template-columns:1fr 320px;gap:14px;height:100%}
#map{height:100%;border-radius:var(--r);border:1px solid var(--line);background:#0e1124}
.darktiles{filter:invert(1) hue-rotate(200deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pin{width:14px;height:14px;border-radius:50%;border:2px solid #0b0d17;box-shadow:0 0 0 1px #ffffff55}
.pin.restricted{outline:2px dashed #c9b6ff;outline-offset:2px}
.who-marker{display:flex;gap:2px}
.who-marker .avatar{width:26px;height:26px;font-size:10px}

/* WORLD / BOOKS */
.two{display:grid;grid-template-columns:320px 1fr;gap:14px;height:100%}
.tree{overflow:auto}
.tree .grp{font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--faint);margin:14px 6px 4px}
.tree .it{padding:5px 8px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.tree .it:hover{background:var(--panel)} .tree .it.on{background:var(--panel2)}
.doc{overflow:auto;padding:22px 34px}
.doc h1,.doc h2,.doc h3{font-family:"Cormorant Garamond",serif;color:#f3ead2;font-weight:600}
.doc h1{font-size:34px;margin-top:0}.doc h2{font-size:25px;border-bottom:1px solid var(--line);padding-bottom:4px}.doc h3{font-size:20px}
.doc table{border-collapse:collapse;margin:10px 0}.doc td,.doc th{border:1px solid var(--line);padding:5px 9px;font-size:13px}
.doc code{font-family:"JetBrains Mono";font-size:12px;background:#ffffff0c;padding:1px 5px;border-radius:4px}
.doc pre{background:#0008;padding:12px;border-radius:8px;overflow:auto}
.doc blockquote{border-left:3px solid var(--lamp);margin:8px 0;padding:2px 14px;color:#e5dcc2;background:#f4c45a0a}
.prose{max-width:720px;margin:0 auto;font-family:"Cormorant Garamond",serif;font-size:20px;line-height:1.6;color:#efe8d6}
.prose p{margin:0 0 .9em;text-indent:1.4em}.prose h1+p,.prose hr+p{text-indent:0}
.prose h1{text-align:center;font-size:36px;margin:10px 0 30px}
.fm{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
input.search{margin-bottom:6px}

/* ACTIVITY */
.act{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;overflow:auto;height:100%;align-content:start}
.tile .big{font-family:"Cormorant Garamond",serif;font-size:36px;color:var(--lamp2);line-height:1}
.span4{grid-column:1/-1}.span2{grid-column:span 2}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;color:var(--faint);font-weight:500;padding:6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
table.t td{padding:5px 6px;border-bottom:1px solid #ffffff08}
.hbar{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
.hbar .lbl{width:110px;color:var(--muted)}.hbar .trk{flex:1;height:10px;background:#ffffff0a;border-radius:9px;overflow:hidden}.hbar .trk i{display:block;height:100%;background:linear-gradient(90deg,var(--bulk2),var(--lamp))}
.modal{position:fixed;inset:0;background:#000a;display:none;place-items:center;z-index:100}
.modal.on{display:grid}
.modal .box{width:min(980px,94vw);height:min(86vh,900px);display:flex;flex-direction:column}
.modal .box .doc{flex:1}
.tabs{display:flex;gap:4px;margin-bottom:8px}
@media (max-width:1100px){.live{grid-template-columns:1fr}.chlist,.side{max-height:240px}.mapwrap,.two{grid-template-columns:1fr}.act{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">✦ Arenya <small>game monitor</small></div>
  <div class="pills" id="pills"></div>
  <div class="spacer"></div>
  <button class="btn" id="pausebtn">Pause</button>
</header>
<nav id="nav"></nav>
<main>
  <section class="view" id="v-live"><div class="live">
    <div class="card chlist" id="chlist"></div>
    <div class="card feedwrap" style="padding:0">
      <div class="feed" id="feed"></div>
      <div class="scrub">
        <button class="btn" id="followbtn" title="Follow live">● Live</button>
        <input type="range" id="scrub" min="1" max="1" value="1">
        <span class="mono muted" id="scrubinfo"></span>
      </div>
    </div>
    <div class="side" id="side"></div>
  </div></section>
  <section class="view" id="v-scenes"><div class="scenes" id="scenes"></div></section>
  <section class="view" id="v-cast"><div class="castgrid" id="castgrid"></div></section>
  <section class="view" id="v-map"><div class="mapwrap"><div id="map"></div><div class="card" style="overflow:auto" id="mapside"></div></div></section>
  <section class="view" id="v-world"><div class="two"><div class="card tree" id="wtree"></div><div class="card doc" id="wdoc"><div class="empty">Pick an entry: lore, mechanics, interviews, outline.</div></div></div></section>
  <section class="view" id="v-books"><div class="two"><div class="card tree" id="btree"></div><div class="card doc" id="bdoc"><div class="empty">Pick a chapter or draft.</div></div></div></section>
  <section class="view" id="v-activity"><div class="act" id="act"></div></section>
</main>
<div class="modal" id="modal"><div class="card box"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div class="tabs" id="mtabs"></div><button class="btn" onclick="closeModal()">Close ✕</button></div><div class="doc" id="mdoc"></div></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const md=s=>window.marked?marked.parse(String(s??"")):"<pre>"+esc(s)+"</pre>";
const api=(p,o)=>fetch(p,o).then(r=>r.json());
const VIEWS=[["live","Live"],["scenes","Scenes"],["cast","Cast"],["map","Map"],["world","World"],["books","Books"],["activity","Activity"]];
const COLORS={dm:"#f4c45a",system:"#6a6d96",human:"#ffffff",author:"#e9a6c9",lorekeeper:"#7fd1c7",director:"#9aa7ff",
  arenya:"#ffb26b",malachi:"#7aa7ff",abernathy:"#e8f27a",kino:"#4fb3a9",ava:"#ff8fa3",caleb:"#b0b6c8"};
const color=a=>COLORS[a]||`hsl(${[...a].reduce((h,c)=>h*31+c.charCodeAt(0)&0xffff,7)%360} 65% 70%)`;
const initials=a=>a==="dm"?"DM":a==="system"?"⚙":a==="human"?"YOU":(S.cast?.[a]?.name||a).split(/[\s"]+/).filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const av=(a,cls="")=>`<div class="avatar ${cls}" style="background:${color(a)};--c:${color(a)}" title="${esc(S.cast?.[a]?.name||a)}">${esc(initials(a))}</div>`;
const nameOf=a=>a==="dm"?"Dungeon Master":a==="system"?"system":a==="human"?"You":(S.cast?.[a]?.name||a);
const timeOf=ts=>ts?new Date(ts).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}):"";
let S={}, MSGS=[], LASTID=0, CH="all", FOLLOW=true, VIEW=location.hash.slice(1)||"live", PLACES={}, MAP=null, MAPLAYER=null, LIB=null;

/* nav */
$("#nav").innerHTML=VIEWS.map(([k,l])=>`<button data-v="${k}">${l}</button>`).join("");
$("#nav").onclick=e=>{const v=e.target.dataset.v;if(v)show(v)};
function show(v){VIEW=v;location.hash=v;document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on",s.id==="v-"+v));render();}

/* polling */
async function tick(){
  try{
    S=await api("/api/state");
    if(S.state.next_id-1!==LASTID){MSGS=await api("/api/messages");const prev=LASTID;LASTID=S.state.next_id-1;onNewMessages(prev);}
    renderHeader(); if(VIEW==="live")renderSide(); if(VIEW!=="live"&&VIEW!=="world"&&VIEW!=="books")render();
  }catch(e){$("#pills").innerHTML=`<span class="pill paused">dashboard can't reach the server: ${esc(e)}</span>`}
}
setInterval(tick,3000);

function renderHeader(){
  const st=S.state, sc=st.scene, running=st.running||[];
  const pills=[];
  pills.push(st.paused?`<span class="pill paused">⏸ <b>paused</b> ${esc(st.pause_reason||"")}</span>`:`<span class="pill live"><span class="dot pulse"></span>live</span>`);
  pills.push(`<span class="pill">phase <b>${esc(st.phase)}</b></span>`);
  pills.push(`<span class="pill">Book <b>${st.book}</b> · Chapter <b>${st.chapter}</b></span>`);
  if(sc)pills.push(`<span class="pill">scene <b>${esc(sc.title)}</b> <span class="faint">${esc(sc.id)}</span></span>`);
  if(running.length)pills.push(`<span class="pill">${running.map(j=>`<span class="dot pulse" style="background:${color(j.agent)}"></span>${esc(j.agent)}<span class="faint">/${esc(j.job)}</span>`).join(" &nbsp;")}</span>`);
  if((st.human_waiting||[]).length)pills.push(`<span class="pill human" onclick="show('live');CH='human';render()">✉ ${st.human_waiting.length} awaiting you</span>`);
  pills.push(`<span class="pill">≈ <b>$${S.cost_total.toFixed(2)}</b> · ${S.turns_total} turns</span>`);
  $("#pills").innerHTML=pills.join("");
  $("#pausebtn").textContent=st.paused?"▶ Resume":"⏸ Pause";
}
$("#pausebtn").onclick=async()=>{await api(S.state.paused?"/api/resume":"/api/pause",{method:"POST"});tick()};

/* ---------- LIVE ---------- */
function onNewMessages(prev){
  const sc=$("#scrub"); const ids=MSGS.map(m=>m.id);
  sc.min=ids.length?ids[0]:1; sc.max=ids.length?ids[ids.length-1]:1; if(FOLLOW)sc.value=sc.max;
  if(VIEW==="live")renderFeed(prev);
}
$("#scrub").oninput=()=>{FOLLOW=+$("#scrub").value>=+$("#scrub").max;$("#followbtn").classList.toggle("primary",FOLLOW);renderFeed()};
$("#followbtn").onclick=()=>{FOLLOW=true;$("#scrub").value=$("#scrub").max;$("#followbtn").classList.add("primary");renderFeed()};
$("#followbtn").classList.add("primary");

function chGroups(){
  const counts={}; MSGS.forEach(m=>counts[m.channel]=(counts[m.channel]||0)+1);
  const names=[...new Set([...(S.channels||[]),...Object.keys(counts)])];
  const g={"Game":["table","ooc","bond"],"Whispers":names.filter(n=>n.startsWith("whisper-")),"Staff":["backstage","human","director"]};
  let h=`<div class="ch ${CH==="all"?"on":""}" data-ch="all"><span>✦ Everything</span><span class="n">${MSGS.length}</span></div>`;
  for(const [k,arr] of Object.entries(g)){h+=`<div class="chsec">${k}</div>`;
    for(const n of arr)h+=`<div class="ch ${CH===n?"on":""}" data-ch="${n}"><span>${n==="human"?"✉ ":n==="bond"?"✧ ":"# "}${esc(n)}</span><span class="n">${counts[n]||""}</span></div>`;}
  $("#chlist").innerHTML=h;
}
$("#chlist").onclick=e=>{const c=e.target.closest(".ch");if(c){CH=c.dataset.ch;chGroups();renderFeed()}};

function msgHTML(m){
  const t=m.type;
  if(t==="scene_start")return `<div class="scenebar" id="m${m.id}"><span>✦ ${esc(m.scene_title||m.body.split("\n")[0].replace(/\*/g,""))}</span></div><div class="sysline" style="text-align:center;margin-left:0">${esc(m.scene||"")} · ${esc((m.body.match(/Location: (.*)/)||[])[1]||"")}</div>`;
  if(t==="scene_end")return `<div class="scenebar end" id="m${m.id}"><span>end of scene</span></div><div class="scenesum">${md(m.body.replace(/^\*\*.*\*\*\n*/,""))}</div>`;
  if(t==="chapter_end")return `<div class="scenebar end"><span>❦ end of chapter</span></div><div class="scenesum">${md(m.body)}</div>`;
  if(t==="roll"){const nat=(m.body.match(/natural (\d+)/)||[])[1];
    return `<div class="roll ${nat==="20"?"crit":nat==="1"?"fumble":""}" id="m${m.id}">${av(m.roller||"system","sm")}<div class="total">${esc(m.total)}</div><div>${md(m.body.replace(/^🎲\s*/,""))}</div><span class="faint mono" style="margin-left:auto">#${m.id}</span></div>`;}
  if(t==="pass"||t==="sheet"||t==="system")return `<div class="sysline" id="m${m.id}">${t==="sheet"?"📜":t==="pass"?"↷":"⚙"} ${md(m.body)}</div>`;
  const cls=t==="narration"?"narr":t==="ooc"?"ooc":t;
  const extra=[];
  if(m.to?.length)extra.push(`→ ${m.to.map(esc).join(", ")}`);
  if(m.awaits?.length)extra.push(`<span class="tag lamp">awaits ${m.awaits.map(esc).join(", ")}</span>`);
  if(m.spotlight?.length)extra.push(`<span class="tag bulk">✦ spotlight ${m.spotlight.map(esc).join(", ")}</span>`);
  if(m.reply_to)extra.push(`<span class="faint">re #${m.reply_to}</span>`);
  return `<div class="msg ${cls}" id="m${m.id}">${av(m.from)}<div style="min-width:0;flex:1"><div class="meta"><span class="who" style="color:${color(m.from)}">${esc(nameOf(m.from))}</span><span class="tag">${esc(t)}</span>${CH==="all"?`<span class="tag ${m.channel==="bond"?"bulk":""}">#${esc(m.channel)}</span>`:""}<span class="faint" style="font-size:12px">${extra.join(" ")}</span><span class="faint mono" style="margin-left:auto">#${m.id} · ${timeOf(m.ts)}</span></div><div class="body">${md(m.body)}</div></div></div>`;
}

function allScenes(){const st=S.state;const sc=[...(st.scenes||[])];if(st.scene)sc.push({...st.scene,open:true,book:st.book,chapter:st.chapter});return sc}

function replay(id){const s=allScenes().find(x=>x.id===id);const list=MSGS.filter(m=>m.scene===id||(m.id>=s.start_id&&s.end_id&&m.id<=s.end_id));

}

/* ---------- modal & router ---------- */
function openModal(tabs){$("#modal").classList.add("on");const set=i=>{$("#mtabs").innerHTML=tabs.map(([t],j)=>`<button class="btn ${i===j?"primary":""}" data-i="${j}">${esc(t)}</button>`).join("");$("#mdoc").innerHTML=tabs[i][1]();$("#mdoc").scrollTop=0};
  $("#mtabs").onclick=e=>{if(e.target.dataset.i)set(+e.target.dataset.i)};set(0)}
function closeModal(){$("#modal").classList.remove("on")}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
function render(){if(!S.state)return;({live:()=>{renderFeed();renderSide()},scenes:renderScenes,cast:renderCast,map:renderMap,world:renderWorld,books:renderBooks,activity:renderActivity})[VIEW]?.()}
tick().then(()=>show(VIEW));
</script>
