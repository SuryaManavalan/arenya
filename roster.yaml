# Agent registry. The Director adds agents with the register_agent tool; you can edit by hand.
# role: dm | player | npc | author | lorekeeper | director
# status: active | benched | dead | retired   (only active agents are woken or counted in groups)
agents:
  dm:
    role: dm
    name: The Dungeon Master
    status: active
  author:
    role: author
    name: The Author
    status: active
  lorekeeper:
    role: lorekeeper
    name: The Lore Keeper
    status: active
  director:
    role: director
    name: The Director
    status: active
  # Player characters get added here once Book 1's opening chapters are imported, e.g.
  # kael:
  #   role: player
  #   name: Kael Varn
  #   status: active
