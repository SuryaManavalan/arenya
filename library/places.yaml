    aliases: [the notary]
    lat: 37.6838
    lon: -122.4595
    kind: other
    visibility: public
    note: Strip-mall notary two doors from Flores de la Paz, across Mission Road from the stone yard. Susmithaa's 19 March declaration notarized here; Box 112 "Meridian Mutual Services" with bait envelope. Likely the "Colma office" Hale claimed.
    sources: ["b1.c15.s10 #0243", "b1.c15.s10 #0249"]
